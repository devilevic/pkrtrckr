# Deploys pkrtrckr to Namecheap over FTPS on every push to main.
# Needs three repository secrets (GitHub > Settings > Secrets and variables > Actions):
#   FTP_SERVER    e.g. server123.web-hosting.com (cPanel sidebar: "Server Name"/hostname) or ftp.pkrtrckr.com
#   FTP_USERNAME  a cPanel FTP account whose directory is the site's document root
#   FTP_PASSWORD  that account's password
# Only changed files are uploaded. api/config.php is not in Git, so it is never touched or deleted.
name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .cpanel.yml
            README.md
            schema.sql
            api/config.example.php
            **/.DS_Store
